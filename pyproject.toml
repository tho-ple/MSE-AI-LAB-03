[project]
name = "dependency-intelligence-lab"
version = "0.1.0"
description = "Week 3 specification-driven concurrent dependency-scanning lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "packaging>=24,<27",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
dependency-api = "dependency_intelligence.bootstrap:main"
dependency-agent-tool = "dependency_intelligence.tool_cli:main"
dependency-fake-upstreams = "dependency_intelligence.fake_upstreams:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "sources: source adapter contracts",
  "cache: cache and single-flight behavior",
  "orchestration: concurrent scanner behavior",
  "transport: API and agent-tool behavior",
  "supplied: completed infrastructure that should pass in the starter",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "checks"]
